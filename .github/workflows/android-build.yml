
name: Build BNM Explorer Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-build.yml"
      - "BNMExplorer-2.0-Inactive-Object-Upgrade-source.zip"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Extract source archive
        run: |
          set -euxo pipefail
          mkdir -p extracted
          unzip -q "BNMExplorer-2.0-Inactive-Object-Upgrade-source.zip" -d extracted
          echo "=== Source files ==="
          find extracted -maxdepth 5 -type f | sort | head -300
          echo "=== CMake projects ==="
          find extracted -name CMakeLists.txt -print
          CMAKE_FILE="$(find extracted -name CMakeLists.txt -print -quit)"
          if [ -z "$CMAKE_FILE" ]; then
            echo "::error::No CMakeLists.txt found"
            exit 1
          fi
          dirname "$CMAKE_FILE" > cmake-source-dir.txt

      - name: Configure Android ARM64
        run: |
          set -euxo pipefail
          SOURCE_DIR="$(cat cmake-source-dir.txt)"
          cmake -S "$SOURCE_DIR" -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile shared library
        run: cmake --build build-arm64 --config Release --parallel 2

      - name: Verify and collect libraries
        run: |
          set -euxo pipefail
          mkdir -p output
          find build-arm64 -type f -name "*.so" -exec cp {} output/ \;
          if ! ls output/*.so >/dev/null 2>&1; then
            echo "::error::No shared libraries were produced"
            exit 1
          fi
          for LIB in output/*.so; do
            file "$LIB"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$LIB" | grep -E "Class:|Machine:"
          done

      - name: Upload Android ARM64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: BNMExplorer-Android-arm64-v8a
          path: output/*.so
          if-no-files-found: error

